[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rag"
version = "0.1.0"
description = "A minimal, self-hosted RAG backend: document ingestion, hybrid retrieval and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "open-rag contributors" }]
keywords = ["rag", "retrieval", "embeddings", "bm25", "evaluation", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/your-org/open-rag"
Issues = "https://github.com/your-org/open-rag/issues"

[project.scripts]
openrag = "openrag.__main__:main"

[tool.setuptools.packages.find]
include = ["openrag*"]

[tool.setuptools.package-data]
openrag = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
